<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    /* Elegant Dark Theme Palette */
    :root {
      --bg-main: #121212;
      --bg-surface: #1e1e1e;
      --bg-hover: #2c2c2c;
      --text-main: #e0e0e0;
      --text-muted: #8b949e;
      --border-color: #30363d;
      --accent-blue: #2f81f7;
      --accent-blue-hover: #1e6feb;
      --danger-red: #f85149;
    }

    body { 
      width: 380px; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      padding: 12px; 
      margin: 0; 
      background: var(--bg-main); 
      color: var(--text-main);
    }

    h4 { margin-top: 0; margin-bottom: 15px; font-weight: 600; color: #ffffff; letter-spacing: 0.3px; }
    .form-group { margin-bottom: 12px; }
    
    label { font-weight: 500; font-size: 11px; display: block; margin-bottom: 5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    select, textarea { width: 100%; padding: 8px; box-sizing: border-box; background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px; outline: none; transition: border-color 0.2s; }
    select:focus, textarea:focus { border-color: var(--accent-blue); }
    textarea { height: 60px; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; resize: vertical; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #666; }

    .btn-row { display: flex; gap: 8px; margin-bottom: 8px; }
    button { flex: 1; padding: 8px 12px; border: 1px solid transparent; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; transition: all 0.2s ease; }
    .btn-primary { background: var(--accent-blue); color: #ffffff; }
    .btn-primary:hover { background: var(--accent-blue-hover); }
    .btn-secondary { background: var(--bg-surface); color: var(--text-main); border-color: var(--border-color); }
    .btn-secondary:hover { background: var(--bg-hover); border-color: #8b949e; }
    hr { border: 0; border-top: 1px solid var(--border-color); margin: 16px 0; }
    
    .rules-container { max-height: 240px; overflow-y: auto; padding-right: 4px; }
    .rule-item { display: flex; align-items: center; background: var(--bg-surface); padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 6px; gap: 10px; transition: opacity 0.2s; }
    .rule-item.disabled { opacity: 0.4; background: transparent; }

    input[type="checkbox"] { accent-color: var(--accent-blue); cursor: pointer; width: 14px; height: 14px; }
    
    /* Styling for the export checkbox & divider */
    .export-cb { accent-color: var(--text-muted) !important; width: 12px !important; height: 12px !important; margin: 0 4px; }
    .action-divider { width: 1px; height: 14px; background: var(--border-color); margin: 0 4px; }

    .rule-info { flex: 1; font-size: 11px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #c9d1d9; }
    .rule-info strong { display: block; font-size: 9px; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .icon-btn { background: none; border: none; padding: 4px; cursor: pointer; font-size: 13px; opacity: 0.6; border-radius: 4px; }
    .icon-btn:hover { opacity: 1; background: var(--bg-hover); }
    .icon-edit { color: var(--text-main); }
    .icon-delete { color: var(--danger-red); }
  </style>
</head>
<body>
  <h4>MAARE</h4>
  
  <div class="form-group">
    <label for="ruleType">Type</label>
    <select id="ruleType">
      <option value="request_header">Request header</option>
      <option value="request_body">Request body</option>
      <option value="response_header">Response header</option>
      <option value="response_body" selected>Response body</option>
      <option value="request_param_name">Request param name</option>
      <option value="request_param_value">Request param value</option>
      <option value="request_first_line">Request first line</option>
    </select>
  </div>

  <div class="form-group">
    <label for="matchStr">Match</label>
    <textarea id="matchStr" placeholder='{"Score":null}'></textarea>
  </div>

  <div class="form-group">
    <label for="replaceStr">Replace</label>
    <textarea id="replaceStr" placeholder='{"Score":"100"}'></textarea>
  </div>

  <div class="btn-row">
    <button id="saveBtn" class="btn-primary">Add Rule</button>
    <button id="clearBtn" class="btn-secondary" style="display: none;">Cancel</button>
  </div>
  
  <div class="btn-row">
    <button id="importBtn" class="btn-secondary">Import</button>
    <button id="exportBtn" class="btn-secondary">Export</button>
  </div>
  <input type="file" id="importFile" accept=".json" style="display: none;" />

  <hr>
  
  <div class="rules-container" id="rulesList">
    <!-- Rules will be injected here via JS -->
  </div>

  <script src="popup.js"></script>
</body>
</html>
